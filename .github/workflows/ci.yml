name: CI

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

# Push and pull_request runs stay in separate groups: a push run builds the branch head, a pull_request
# run builds the merge with the base branch, and letting either cancel the other could leave the merge untested.
# Never cancel on main: a cancelled snapshot job could leave the snapshot release deleted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # -count=1 because the tests run a binary built at test time, which the test cache does not track.
      - name: Test
        run: go test -count=1 ./...

      - name: Cross-build
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath -o /dev/null .
          done

  # A convenience for trying out the latest main: every push to main recreates the pre-release "snapshot".
  snapshot:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: Package
        run: ./.github/scripts/package.sh "snapshot-$(git rev-parse --short HEAD)" dist

      - name: Recreate the snapshot release
        run: |
          # The release may not exist yet, which is fine. Any other failure stops the job before the tag
          # moves, so old archives never stay attached to a different commit.
          if gh release view snapshot > /dev/null 2> view.err; then
            gh release delete snapshot --yes
          elif ! grep -q "release not found" view.err; then
            cat view.err >&2
            exit 1
          fi
          git tag -f snapshot "${{ github.sha }}"
          git push -f origin refs/tags/snapshot
          gh release create snapshot --verify-tag --prerelease \
            --title "Latest snapshot ($(git rev-parse --short HEAD))" \
            --notes "Automatically published on every push to \`main\`, from commit ${{ github.sha }}." \
            dist/*
